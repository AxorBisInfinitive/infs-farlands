name: Java LoC Report

on:
  push:
    branches: [fabric-26.1.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loc:
    name: Generate LoC Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Select Summary Directories
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/top_dirs.py src 10 \
            > "$RUNNER_TEMP/selected-directories.json"

      - name: Generate LoC Summary
        env:
          SELECTED_DIRECTORIES_FILE: ${{ runner.temp }}/selected-directories.json
        run: python3 .github/scripts/loc_report.py

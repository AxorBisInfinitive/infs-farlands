plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// 设置版本号为时间
def buildTime = new Date().format("MM-dd.HH-mm")
def baseVersion = project.properties.get("version", "0.0.5-alpha")
version = baseVersion + "." + buildTime

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"infs-farlands" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
        client {
            programArgs "--username", "I"
            // Chunky 的在途宽度：默认 50，而它读的是系统属性、类初始化时读一次，所以只能从启动参数给。
            // 取值 168 是照本机逻辑核数与预生成波前试的，端口侧同时要看 main wait 与 io pending。
            vmArgs "-Dchunky.maxWorkingCount=168"
        }
    }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.4"
	annotationProcessor "io.github.llamalad7:mixinextras-fabric:0.5.4"

	// Sodium: mc26.1.2-0.9.2-fabric
	compileOnly "maven.modrinth:AANobbMI:tZQ3jqnf"
	localRuntime "maven.modrinth:AANobbMI:tZQ3jqnf"

	// Chunky: 1.5.3
	compileOnly "maven.modrinth:fALzjamp:4Eotm6ov"
	localRuntime "maven.modrinth:fALzjamp:4Eotm6ov"

	// Fabric API 挂开发运行环境
	localRuntime "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"

    // Iris: 1.11.4+26.1-fabric
	// localRuntime "maven.modrinth:YL57xq9U:sZbVsl2Q"

	// Spark: 1.10.187-fabric
	// localRuntime "maven.modrinth:l6YH9Als:e3hsPc1o"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
